<!DOCTYPE html>
<html lang="vi">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Chi tiêu thông minh cho hai người 🐝">

  <!-- PWA -->
  <meta name="application-name" content="My Moneyyy!!!">
  <meta name="theme-color" content="#F7F7F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F0F0F" media="(prefers-color-scheme: dark)">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Moneyyy">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>My Moneyyy!!!</title>
  <link rel="manifest" href="manifest.json">
  <script src="push_helper.js" defer></script>
  <script src="pwa_helper.js" defer></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #F7F7F7;
    }

    /* Shown until Flutter paints its first frame — without it a freshly
       launched PWA sits on a blank white screen while main.dart.js loads. */
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background-color: #F7F7F7;
      transition: opacity 200ms ease-out;
    }

    #loading.fade-out { opacity: 0; }

    #loading img {
      width: 88px;
      height: 88px;
      border-radius: 24px;
    }

    #loading .spinner {
      width: 22px;
      height: 22px;
      border: 2px solid rgba(15, 15, 15, 0.15);
      border-top-color: #0F0F0F;
      border-radius: 50%;
      animation: spin 700ms linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (prefers-color-scheme: dark) {
      html, body, #loading { background-color: #0F0F0F; }
      #loading .spinner {
        border-color: rgba(245, 245, 245, 0.15);
        border-top-color: #F5F5F5;
      }
    }
  </style>
</head>
<body>
  <div id="loading">
    <img src="icons/Icon-192.png" alt="My Moneyyy!!!">
    <div class="spinner"></div>
  </div>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
