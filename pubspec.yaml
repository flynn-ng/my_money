name: money_manage
description: My Moneyyy!!! - Personal finance app for two.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Backend / Auth / Realtime
  supabase_flutter: ^2.5.0

  # State management
  flutter_riverpod: ^3.3.1

  # Navigation
  go_router: ^17.2.3

  # Charts
  fl_chart: ^1.2.0

  # UI
  google_fonts: ^8.1.0
  flutter_animate: ^4.5.0
  gap: ^3.0.1

  # Formatting
  intl: ^0.20.0

  # Forms
  flutter_form_builder: ^10.3.0
  form_builder_validators: ^11.1.2

  # Utilities
  uuid: ^4.4.0
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
